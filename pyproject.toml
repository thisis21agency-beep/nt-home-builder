[project]
name = "rnt-home-builder"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.17",
  "Pillow>=11.0,<13.0",
  "psycopg[binary]>=3.2,<4.0",
  "gunicorn>=23,<24",
  "django-storages[s3]>=1.14,<2.0",
  "boto3>=1.35,<2.0",
  "dj-database-url>=2.2,<3.0",
]

[tool.vercel.scripts]
build = 'if [ -n "$DATABASE_URL" ]; then python manage.py migrate --noinput && python manage.py seed_rnt_homepage && python manage.py bootstrap_admin; fi'
